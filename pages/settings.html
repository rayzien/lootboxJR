<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owoloot - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 40, 51, 0.6);
            --primary-gradient: linear-gradient(135deg, #c3073f, #950740);
            --text-main: #c5c6c7;
            --text-heading: #ffffff;
            --glass-border: rgba(195, 7, 63, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg-color); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 80% 20%, rgba(149, 7, 64, 0.15) 0%, transparent 60%);
        }
        .container { width: 100%; max-width: 800px; padding: 2rem; z-index: 1; }
        .glass-card {
            background: var(--surface-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 3rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: slideIn 0.5s ease-out forwards;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        h1 {
            font-size: 3rem; font-weight: 800; margin-bottom: 0.5rem;
            background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .settings-list {
            display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;
        }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem; background: rgba(255, 255, 255, 0.02); border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); transition: background 0.3s;
        }
        .setting-row:hover { background: rgba(195, 7, 63, 0.05); }
        .setting-info h3 { color: #fff; font-size: 1.1rem; }
        .setting-info p { font-size: 0.9rem; opacity: 0.7; margin-top: 0.3rem; }
        
        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #c3073f; }
        input:checked + .slider:before { transform: translateX(26px); }

        .nav-link { color: #c3073f; text-decoration: none; margin-top: 2rem; display: inline-block; font-weight: 600; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Settings</h1>
            <p>Customize your user experience.</p>
            
            <div class="settings-list">
                <div class="setting-row">
                    <div class="setting-info">
                        <h3>Dark Mode</h3>
                        <p>Enable beautiful dark theme across the app.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <h3>Notifications</h3>
                        <p>Receive push notifications for updates.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <h3>Auto-save</h3>
                        <p>Automatically save your work in the background.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <a href="/" class="nav-link">← Back to Home</a>
        </div>
    </div>
    <script src="/common/common.js"></script>
    <script src="/common/navbar.js"></script>
    <script src="/common/burgermenu.js"></script>
</body>
</html>
