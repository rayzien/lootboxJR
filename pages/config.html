<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owoloot - Configuration</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 40, 51, 0.6);
            --primary-gradient: linear-gradient(135deg, #f0a500, #cf7500);
            --text-main: #c5c6c7;
            --text-heading: #ffffff;
            --glass-border: rgba(240, 165, 0, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg-color); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 50% 50%, rgba(207, 117, 0, 0.15) 0%, transparent 60%);
        }
        .container { width: 100%; max-width: 900px; padding: 2rem; z-index: 1; }
        .glass-card {
            background: var(--surface-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 3rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        h1 {
            font-size: 3rem; font-weight: 800; margin-bottom: 1rem;
            background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .config-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;
        }
        .config-item {
            background: rgba(255, 255, 255, 0.02); padding: 1.5rem; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease;
        }
        .config-item:hover {
            background: rgba(240, 165, 0, 0.05); border-color: rgba(240, 165, 0, 0.3); transform: translateY(-3px);
        }
        .config-item h3 { color: #fff; margin-bottom: 0.5rem; font-size: 1.2rem; }
        input.modern-input {
            width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); color: #fff; margin-top: 0.5rem; font-family: 'Outfit', sans-serif;
            transition: border-color 0.3s ease;
        }
        input.modern-input:focus { outline: none; border-color: #f0a500; }
        .nav-link { color: #f0a500; text-decoration: none; margin-top: 2rem; display: inline-block; font-weight: 600; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Configuration</h1>
            <p>Manage your core application configurations efficiently.</p>
            
            <div class="config-grid">
                <div class="config-item">
                    <h3>App Environment</h3>
                    <p>Current staging environment.</p>
                    <input type="text" class="modern-input" value="Production" />
                </div>
                <div class="config-item">
                    <h3>API Key</h3>
                    <p>Your secure authentication token.</p>
                    <input type="password" class="modern-input" value="••••••••••••••••" />
                </div>
                <div class="config-item">
                    <h3>Database URL</h3>
                    <p>Connection string for the database.</p>
                    <input type="text" class="modern-input" value="postgres://user:pass@localhost:5432/owoloot" />
                </div>
                <div class="config-item">
                    <h3>Cache Timeout</h3>
                    <p>TTL for redis cache in seconds.</p>
                    <input type="number" class="modern-input" value="3600" />
                </div>
            </div>
            
            <a href="/" class="nav-link">← Back to Home</a>
        </div>
    </div>
</body>
</html>
